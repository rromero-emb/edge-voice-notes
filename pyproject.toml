[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-voice-notes"
version = "0.1.0"
description = "Offline voice notes for small ARM boards: record, crash-safe queue, whisper.cpp transcription, llama.cpp summary"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evn = "edge_voice_notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
